<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact me</title>
    <link rel="icon" href="images/icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --page-bg: #ffffff;
        --ink: #222;
        --gutter: clamp(10px, 1.5vw, 24px);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        padding: 38px var(--gutter) 0;
        overflow-x: hidden;
        background: var(--page-bg);
        color: var(--ink);
        font-family: "Poppins", sans-serif;
        font-weight: 500;
        font-size: 15pt;
      }

      a {
        color: inherit;
      }

      a:focus-visible {
        outline: 1px solid currentColor;
        outline-offset: 4px;
      }
      /* HEADER */
      .logo {
        position: fixed;
        top: 24px;
        left: var(--gutter);
        z-index: 100;
        display: block;
        width: 200px;
        height: auto;
      }

      .logo img {
        display: block;
        width: 100%;
        height: auto;
        object-fit: contain;
      }

      .menu {
        position: fixed;
        top: 25px;
        right: var(--gutter);
        display: flex;
        align-items: center;
        gap: 10px;
        z-index: 100;
      }

      .menu a:nth-child(4) {
        margin-left: 25px;
      }

      .menu a {
        position: relative;
        text-decoration: none;
        color: #222;
        font-size: 16px;
        font-weight: 500;
        padding: 8px 10px;
        border-radius: 0;
        background: transparent;
      }

      .menu a:nth-child(5) {
        margin-left: 12px;
      }

      .menu a:has(img) {
        padding: 8px 0;
      }

      .menu img {
        width: 18px;
        height: 18px;
      }

      .menu.sobre-imagen a {
        color: white;
      }

      .menu.sobre-imagen .menu-line {
        background: white;
      }

      .menu.sobre-imagen img,
      .logo.sobre-imagen img {
        filter: brightness(0) invert(1);
      }

      /* MÓVIL */
      @media (max-width: 600px) {
        .logo {
          width: 90px;
          top: 26px;
        }

        .menu {
          top: 20px;
          right: 18px;
        }
      }

      /* FOTO CENTRAL */
      .foto-central {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        min-height: 85vh;
        padding: 100px 20px 60px;
      }

      .foto-con-texto {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        text-align: center;
      }

      .foto-con-texto img {
        display: block;
        width: 240px;
        max-width: 100%;
        height: auto;
        object-fit: contain;
        margin: 0 auto;
      }

      .foto-texto {
        width: 100%;
        max-width: 600px;
        margin: 20px auto 0;
        text-align: center;
        font-size: 16px;
        font-weight: 400;
        font-family: "Poppins", sans-serif;
        line-height: 1.8;
      }

      /* ENLACES DEL TEXTO */
      .foto-texto a {
        color: black;
        text-decoration: underline;
        text-underline-offset: 3px;
        transition: color 0.25s ease;
      }

      /* FOOTER */
      footer {
        position: relative;
        width: 100vw;
        min-height: 280px;
        margin-left: calc(50% - 50vw);
        overflow: hidden;
        background: black;
        color: white;
      }

      .footer-links {
        position: absolute;
        top: 38px;
        left: clamp(30px, 3vw, 110px);
        right: clamp(30px, 3vw, 110px);
        z-index: 5;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
      }

      .footer-col {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 11px;
      }

      .footer-heading {
        margin-bottom: 7px;
        font-size: 14px;
        letter-spacing: 0.04em;
      }

      .footer-col a {
        color: white;
        font-size: 15px;
        text-decoration: none;
        transition: opacity 0.2s ease;
      }

      .footer-col a:hover {
        color: #396ebe;
      }

      .footer-bottom {
        position: absolute;
        left: clamp(30px, 3vw, 110px);
        bottom: 18px;
        font-size: 14px;
      }

      /* BOTÓN HAMBURGUESA: OCULTO EN ESCRITORIO */
      .menu-toggle {
        display: none;
      }

      /* MENÚ DESPLEGABLE EN MÓVIL */
      @media (max-width: 600px) {
        .logo {
          width: 90px;
          top: 26px;
          z-index: 110;
        }

        .menu-toggle {
          position: fixed;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          gap: 6px;
          top: 22px;
          right: 18px;
          width: 38px;
          height: 38px;
          padding: 7px;
          border: none;
          background: transparent;
          cursor: pointer;
          z-index: 120;
        }

        .menu-toggle span {
          display: block;
          width: 24px;
          height: 2px;
          background: #222;
          transition:
            transform 0.25s ease,
            opacity 0.25s ease;
        }

        /* Animación a una X */
        .menu-toggle.open span:first-child {
          transform: translateY(8px) rotate(45deg);
        }

        .menu-toggle.open span:nth-child(2) {
          opacity: 0;
        }

        .menu-toggle.open span:last-child {
          transform: translateY(-8px) rotate(-45deg);
        }

        /* Panel desplegable */
        .menu {
          display: none;
          position: fixed;
          top: 70px;
          right: 0px;
          left: 0px;
          flex-direction: column;
          align-items: flex-start;
          gap: 8px;
          padding: 22px;
          background: white;
          z-index: 105;
        }

        .menu.open {
          display: flex;
        }

        .menu a {
          padding: 8px 0;
          font-size: 16px;
          color: #222;
        }

        .menu a:nth-child(4),
        .menu a:nth-child(5) {
          margin-left: 0;
        }

        .menu a:has(img) {
          display: inline-flex;
          align-items: center;
          padding: 8px 0;
        }

        .menu img {
          width: 20px;
          height: 20px;
        }
      }
    </style>
  </head>
  <body>
    <a href="index.html" class="logo">
      <img src="images/lucíarodríguez.png" alt="Logo de Lucía Rodríguez" />
    </a>
    <button class="menu-toggle" aria-label="Abrir menú" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <!-- MENU -->
    <div class="menu">
      <a href="index.html">Work</a>
      <a href="about.html">About</a>
      <a href="contact.html" class="active">Contact</a>

      <a
        href="https://www.instagram.com/luciarodriguezcn/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img src="img/instagram2.png" alt="Instagram" />
      </a>

      <a
        href="https://www.linkedin.com/in/lucia-rodriguez-cuenca-621636332/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img src="img/linkedin.png" alt="LinkedIn" />
      </a>
    </div>

    <!-- FOTO CENTRAL -->

    <main class="foto-central">
      <div class="foto-con-texto">
        <img src="images/icon.png" alt="Fotografía de Lucía" />

        <p class="foto-texto">
          Whether you want to work together or just say hi, feel free to reach
          out at
          <a href="mailto:luciarodriguezcn@gmail.com">
            luciarodriguezcn@gmail.com </a
          >, or find me on
          <a
            href="https://www.instagram.com/luciarodriguezcn/"
            target="_blank"
            rel="noopener noreferrer"
            >Instagram</a
          >
          or
          <a
            href="https://www.linkedin.com/in/lucia-rodriguez-cuenca-621636332/"
            target="_blank"
            rel="noopener noreferrer"
            >LinkedIn</a
          >.
          <br />
          <br />
          Hope you have a lovely day!
        </p>
      </div>
    </main>

    <footer>
      <div class="footer-links">
        <div class="footer-col">
          <span class="footer-heading">EXPLORE</span>
          <a href="index.html">Work ↗</a>
          <a href="about.html">About ↗</a>
          <a href="contact.html">Contact ↗</a>
        </div>

        <div class="footer-col">
          <span class="footer-heading">SAY HELLO</span>
          <a href="mailto:luciarodriguezcn.com">Email ↗</a>
          <a
            href="https://www.linkedin.com/in/lucia-rodriguez-cuenca-621636332/"
            target="_blank"
            rel="noopener noreferrer"
            >LinkedIn ↗</a
          >
          <a
            href="https://www.instagram.com/luciarodriguezcn/"
            target="_blank"
            rel="noopener noreferrer"
            >Instagram ↗</a
          >
        </div>
      </div>

      <div class="footer-bottom">
        <span>Lucía Rodríguez ©</span>
      </div>
    </footer>

    <script>
      const menuToggle = document.querySelector(".menu-toggle");
      const menu = document.querySelector(".menu");

      menuToggle.addEventListener("click", () => {
        const isOpen = menu.classList.toggle("open");

        menuToggle.classList.toggle("open", isOpen);
        menuToggle.setAttribute("aria-expanded", isOpen);
        menuToggle.setAttribute(
          "aria-label",
          isOpen ? "Cerrar menú" : "Abrir menú",
        );
      });

      // Cerrar el menú al seleccionar un enlace
      menu.querySelectorAll("a").forEach((link) => {
        link.addEventListener("click", () => {
          menu.classList.remove("open");
          menuToggle.classList.remove("open");
          menuToggle.setAttribute("aria-expanded", "false");
          menuToggle.setAttribute("aria-label", "Abrir menú");
        });
      });
    </script>
  </body>
</html>
