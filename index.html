      /* MENU */
      .menu {
        position: fixed;
        top: 25px;
        right: var(--gutter);
        display: flex;
        align-items: center;
        gap: 10px;
        z-index: 100;
      }

      .menu a:nth-child(4) {
        margin-left: 25px;
      }

      /* Espacio entre los dos iconos */
      .menu a:has(img) {
        padding: 8px 5px;
      }

      .menu a {
        position: relative;
        text-decoration: none;
        color: #222;
        font-size: 16px;
        font-weight: 500;
        padding: 8px 10px;
        border-radius: 0;
        background: transparent;
      }

      .menu a:nth-child(5) {
        margin-left: 12px;
      }

      /* Iconos */
      .menu a:has(img) {
        padding: 8px 0px;
      }

      .menu img {
        width: 18px;
        height: 18px;
      }

      /* PROJECT GRID */
      /* PROJECT GRID */
      .contenedor {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-auto-flow: dense;
        grid-auto-rows: 240px;
        gap: 16px;
        width: 100%;
        margin: 42px auto 120px;
      }

      .tarjeta {
        display: flex;
        min-width: 0;
        flex-direction: column;
        margin: 0;
        padding: 0;
        border: 0;
        background: transparent;
      }

      /* Tamaños de las tarjetas */
      .tarjeta:nth-child(1) {
        grid-column: span 1;
        grid-row: span 2;
      }

      .tarjeta:nth-child(2) {
        grid-column: span 1;
        grid-row: span 3;
      }

      .tarjeta:nth-child(3) {
        grid-column: span 1;
        grid-row: span 2;
      }

      .tarjeta:nth-child(4) {
        grid-column: span 1;
        grid-row: span 2;
      }

      .tarjeta:nth-child(5) {
        grid-column: span 1;
        grid-row: span 2;
      }

      .tarjeta:nth-child(6) {
        grid-column: span 1;
        grid-row: span 2;
      }

      /* IMÁGENES CON HOVER */
      .imagen-card {
        position: relative;
        width: 100%;
        flex: 1;
        min-height: 0;
        aspect-ratio: auto;
        overflow: hidden;
      }

      .imagen-card img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: opacity 0.4s ease;
      }

      .imagen-card .imagen-hover {
        opacity: 0;
      }

      .tarjeta:hover .imagen-card .imagen-hover {
        opacity: 1;
      }

      .tarjeta:hover .imagen-card img:first-child {
        opacity: 0;
      }

      /* BALANCEO DE LA IMAGEN HOVER - CARD 2 */
      .tarjeta:nth-child(2) .imagen-hover {
        transform-origin: center center;
      }

      .tarjeta:nth-child(2):hover .imagen-hover {
        animation: balanceo 2s ease-in-out infinite alternate;
      }

      @keyframes balanceo {
        0% {
          transform: rotate(-4deg);
        }

        100% {
          transform: rotate(4deg);
        }
      }

      .texto-card {
        display: block;
        margin-top: 6px;
        margin-bottom: 6px;
        color: #000000;
        font-size: 16px;
        font-weight: 500;
        line-height: 1.3;
        letter-spacing: 0.02em;
      }

      /* FUN PROJECTS */
      .fun-wrapper {
        position: relative;
        z-index: 1;
        width: fit-content;
        margin: 88px auto 100px;
        isolation: isolate;
      }

      .fun-link {
        position: relative;
        z-index: 2;
        display: flex;
        width: fit-content;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin: 0 auto;
        padding: 12px 20px;
        border: 1px solid var(--ink);
        border-radius: 0;
        color: var(--ink);
        font-size: 15px;
        text-decoration: none;
        transition:
          background 0.25s ease,
          color 0.25s ease;
      }

      .fun-link img {
        width: 14px;
        height: 14px;
      }

      .fun-link:hover {
        background: black;
        color: white;
      }

      .fun-link:hover img {
        filter: brightness(0) invert(1);
      }

      .fun-preview {
        position: absolute;
        bottom: 10px;
        left: 50%;
        z-index: 1;
        width: 380px;
        height: 190px;
        transform: translateX(-50%);
        pointer-events: none;
      }

      .fun-preview img {
        position: absolute;
        width: 85px;
        height: 85px;
        border-radius: 0;
        object-fit: cover;
        opacity: 0;
        transform: translateY(28px) scale(0.8);
        transition:
          opacity 0.35s ease,
          transform 0.45s ease;
      }

      .preview-1 {
        left: 5px;
        bottom: 0;
        rotate: -12deg;
      }
      .preview-2 {
        left: 85px;
        bottom: 45px;
        rotate: 8deg;
      }
      .preview-3 {
        left: 165px;
        bottom: 65px;
        rotate: -6deg;
      }
      .preview-4 {
        left: 245px;
        bottom: 35px;
        rotate: 12deg;
      }
      .preview-5 {
        left: 300px;
        bottom: -5px;
        rotate: -10deg;
      }

      .fun-wrapper:hover .fun-preview img,
      .fun-wrapper:focus-within .fun-preview img {
        opacity: 1;
      }

      .fun-wrapper:hover .preview-1 {
        transform: translateY(0) rotate(-12deg);
      }
      .fun-wrapper:hover .preview-2 {
        transform: translateY(0) rotate(8deg);
      }
      .fun-wrapper:hover .preview-3 {
        transform: translateY(0) rotate(-6deg);
      }
      .fun-wrapper:hover .preview-4 {
        transform: translateY(0) rotate(12deg);
      }
      .fun-wrapper:hover .preview-5 {
        transform: translateY(0) rotate(-10deg);
      }

      /* FOOTER */
      footer {
        position: relative;
        width: 100vw;
        min-height: 280px;
        margin-left: calc(50% - 50vw);
        overflow: hidden;
        background: black;
        color: white;
      }

      .footer-links {
        position: absolute;
        top: 38px;
        left: clamp(30px, 3vw, 110px);
        right: clamp(30px, 3vw, 110px);
        z-index: 5;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
      }

      .footer-col {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 11px;
      }

      .footer-heading {
        margin-bottom: 7px;
        font-size: 14px;

      }

      .footer-col a {

        font-size: 15px;

      .footer-col a:hover {

      .footer-bottom {

        font-size: 14px;
      }

        display: none;
      }

      /* Logo superior izquierdo */
      .logo {
        position: fixed;
        top: 24px;
        left: var(--gutter);

        width: 200px;

        }
      }

      /*
                  @media (hover: hover) and (pointer: fine) {

      /* CUSTOM CURSOR */
      .cursor {
        display: none;
      }

      .cursor-text {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 1001;
        display: block;
        padding: 8px 10px;
        color: white;
        font-size: 9px;
        letter-spacing: 0.08em;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transform: translate(14px, 14px);
        transition: opacity 0.15s;
      }

      .cursor-text.visible {
        opacity: 1;
      }

      .cursor-icon {
        width: 11px;
        height: 11px;
        margin-left: 5px;
        vertical-align: middle;
      }

      /* RESPONSIVE */
      @media (min-width: 601px) and (max-width: 900px) {
        .contenedor {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          grid-auto-rows: clamp(150px, 22vw, 210px);
          gap: 12px;
        }

        .footer-art pre {
          font-size: 5px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* TRANSICIÓN DE COLOR DEL HEADER */
      .menu,
      .menu a,
      .menu-line,
      .logo img {
        transition:
          color 0.25s ease,
          filter 0.25s ease,
          background-color 0.25s ease;
      }

      .menu.sobre-imagen a {
        color: white;
      }

      .menu.sobre-imagen .menu-line {
        background: white;
      }

      .menu.sobre-imagen img,
      .logo.sobre-imagen img {
        filter: brightness(0) invert(1);
      }

      @media (hover: hover) and (pointer: fine) {
        body.custom-cursor,
        body.custom-cursor * {
          cursor:
            url("img/manita.png") 8 2,
            pointer !important;
        }
      }

      /* HAMBURGUESA: OCULTA EN ESCRITORIO */
      .menu-toggle {
        display: none;
      }

      /* MENÚ HAMBURGUESA EN MÓVIL */
      @media (max-width: 600px) {
        .menu-toggle {
          position: fixed;
          top: 20px;
          right: 18px;
          z-index: 120;
          display: flex;
          flex-direction: column;

          align-items: center;
          gap: 6px;
          width: 38px;
          height: 38px;
          padding: 7px;
          border: none;
          background: transparent;
          cursor: pointer;
        }

        .menu-toggle span {
          display: block;
          width: 24px;
          height: 2px;
          background: #222;
          transition:
            transform 0.25s ease,
            opacity 0.25s ease;
        }

        .menu-toggle.open span:first-child {
          transform: translateY(8px) rotate(45deg);
        }

        .menu-toggle.open span:nth-child(2) {
          opacity: 0;
        }

        .menu-toggle.open span:last-child {
          transform: translateY(-8px) rotate(-45deg);
        }

        .menu {
          display: none;
          position: fixed;
          top: 70px;
          right: 0px;
          left: 0px;
          z-index: 110;
          flex-direction: column;
          align-items: flex-start;
          gap: 8px;
          padding: 22px;
          background: white;
        }

        .menu.open {
          display: flex;
        }

        .menu a,
        .menu.sobre-imagen a {
          padding: 8px 0;

          color: #222;

        }

        .menu a:nth-child(4),
        .menu a:nth-child(5) {
          margin-left: 0;
        }

        .menu a:has(img) {
          display: inline-flex;
          align-items: center;
          padding: 8px 0;
        }

        .menu img {
          width: 20px;
          height: 20px;
        }
      }
    </style>

    <script>
      (() => {
        const finePointer = window.matchMedia(
          "(hover: hover) and (pointer: fine)",
        ).matches;

        const cards = document.querySelectorAll(".tarjeta");
        const footer = document.querySelector("footer");
        const cursor = document.querySelector(".cursor");
        const cursorText = document.querySelector(".cursor-text");
        const cursorLabel = document.querySelector(".cursor-label");
        const cursorIcon = document.querySelector(".cursor-icon");

        const menu = document.querySelector(".menu");
        const logo = document.querySelector(".logo");

        // MENÚ HAMBURGUESA
        const menuToggle = document.querySelector(".menu-toggle");

        menuToggle.addEventListener("click", () => {
          const isOpen = menu.classList.toggle("open");

          menuToggle.classList.toggle("open", isOpen);
          menuToggle.setAttribute("aria-expanded", isOpen);
          menuToggle.setAttribute(
            "aria-label",
            isOpen ? "Cerrar menú" : "Abrir menú",
          );
        });

        // Cerrar el menú al pulsar un enlace
        menu.querySelectorAll("a").forEach((link) => {
          link.addEventListener("click", () => {
            menu.classList.remove("open");
            menuToggle.classList.remove("open");
            menuToggle.setAttribute("aria-expanded", "false");
            menuToggle.setAttribute("aria-label", "Abrir menú");
          });
        });

        // CURSOR PERSONALIZADO
        if (finePointer && cursor && cursorText && cursorLabel && cursorIcon) {
          document.body.classList.add("custom-cursor");

          document.addEventListener("mousemove", (event) => {
            cursorText.style.left = `${event.clientX}px`;
            cursorText.style.top = `${event.clientY}px`;
          });

          cards.forEach((card) => {
            card.addEventListener("mouseenter", () => {
              cursorText.classList.add("visible");
              cursorLabel.textContent = "COMING SOON";
              cursorIcon.style.display = "none";
            });

            card.addEventListener("mouseleave", () => {
              cursorText.classList.remove("visible");
              cursorLabel.textContent = "VIEW PROJECT";
              cursorIcon.style.display = "";
            });
          });
        }
        /*
        // CURSOR PERSONALIZADO
        if (finePointer && cursor && cursorText && cursorLabel && cursorIcon) {
          document.body.classList.add("custom-cursor");

        // DETECTAR IMÁGENES DEBAJO DEL HEADER
        function isOverImage(element) {
          const rect = element.getBoundingClientRect();

          const points = [
            [rect.left + rect.width / 2, rect.top + rect.height / 2],
            [rect.left + 2, rect.top + rect.height / 2],
            [rect.right - 2, rect.top + rect.height / 2],
          ];

          // Ocultamos temporalmente el elemento para detectar lo que hay detrás
          element.style.visibility = "hidden";

          const isImage = points.some(([x, y]) => {
            const behind = document.elementFromPoint(x, y);
            return !!behind?.closest(".imagen-card");
          });

          element.style.visibility = "";
          return isImage;
        }

        function updateHeaderColors() {
          menu.classList.toggle("sobre-imagen", isOverImage(menu));
          logo.classList.toggle("sobre-imagen", isOverImage(logo));
        }

        window.addEventListener("scroll", updateHeaderColors, {
          passive: true,
        });

        updateHeaderColors();
      })();
    </script>
