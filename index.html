<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucía Rodríguez ∙ Home</title>
    <link rel="icon" href="../images/1.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --font: 'Courier Prime', monospace;
            --bg-color: white;
            --text-color: black;
        }

        body {
            font-family: var(--font);
            background: var(--bg-color);
            color: var(--text-color);
        }

        .page {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 400px;
            padding: 40px 30px;
        }


        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .site-name a {
            display: block;
            font-size: 16pt;
            text-decoration: none;
            color: var(--text-color);
            margin-bottom: 0px;
        }

        .site-name a:hover {
            color: var(--link-hover);
        }

        nav {
            position: fixed;
            top: 45px;
            right: 40px;
            display: flex;
            gap: 48px;
        }

        nav a {
            display: block;
            font-size: 12pt;
            color: var(--text-color);
            text-decoration: none;
        }

        nav a:hover,
        .site-name a:hover {
            color: #e97d25;
        }

        .img-center {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 180px;
            margin-top: 210px;
            padding-bottom: 240px;
        }

        .main {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .img-center img {
            width: 620px;
            height: auto;
            object-fit: cover;
            transition: transform 0.5s ease;
            overflow: hidden;
        }

        .contact-block {
            max-width: 520px;
        }

        .contact-title {
            font-size: 82pt;
            text-align: right;
            position: absolute;
            bottom: 20px;
            right: 40px;
        }

        .contact-text {
            font-size: 14pt;
            color: var(--text-color);
            position: absolute;
            bottom: 285px;
            right: 1380px;
        }

        .img-center img.scroll-reveal {
            opacity: 0;
            transform: translateY(50px);
            transition: opacity 1s ease-out, transform 1s ease-out;
        }

        .img-center img.scroll-reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .hidden {
            display: none !important;
        }

        /*------------------------------------------*/

        .filters {
            position: fixed;
            left: 40px;
            top: 55%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 11pt;
        }

        .filters label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .filters input {
            order: 2;
        }

        input[type="radio"] {
            appearance: none;
            width: 12px;
            height: 12px;
            border: 1px solid black;
            border-radius: 50%;
            position: relative;
            cursor: pointer;
        }

        input[type="radio"]:checked::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            background: black;
            border-radius: 100%;
            transform: translate(-50%, -50%);
        }

        .caption {
            font-size: 12pt;
            text-align: center;
            padding-top: 8px;
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px;
            background: rgb(255, 255, 255);
            z-index: 1000;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .img-center>* {
            transition: opacity 0.4s ease;
        }

        @keyframes giro-suave {
            0% {
                transform: rotate(0deg);
            }

            25% {
                transform: rotate(5deg);
            }

            50% {
                transform: rotate(0deg);
            }

            75% {
                transform: rotate(-5deg);
            }

            100% {
                transform: rotate(0deg);
            }
        }

        .img-center a[href="bom.html"] {
            display: block;
            position: relative;
        }

        .nav-side {
            display: none;
        }


        .img-center a[href="bom.html"]+.caption {
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .img-center a[href="bom.html"]:hover+.caption {
            opacity: 1;
        }


        .animate-rotate:hover {
            animation: giro-suave 3s ease-in-out infinite;
        }

        .menu-toggle {
            display: none;
            /* Oculto por defecto en desktop */
        }

        @media (max-width: 768px) {

            /* Layout vertical */
            .page {
                flex-direction: column;
            }

            /* Header más compacto */
            .header {
                padding: 20px;
            }

            nav {
                position: static;
                gap: 20px;
            }

            /* Ocultar filtros en móvil (mejor UX) */
            .filters {
                display: none;
            }

            /* Contenedor de imágenes */
            .img-center {
    margin-top: 110px;
    padding: 0 18px 80px;
    display: flex;
    flex-direction: column;
    gap: 60px;
}

.img-center > div {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

           .img-center img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 2px;
    transition: transform 0.4s ease, opacity 0.4s ease;
}

.img-center > div {
    padding-bottom: 10px;
}

            /* Texto */
            .contact-title {
                position: static;
                font-size: 36pt;
                text-align: left;
                margin-top: 40px;
            }

            .contact-text {
                position: static;
                font-size: 12pt;
                margin-bottom: 20px;
            }

            .nav-side.show {
                left: 0;
            }

            .overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(8px);

                opacity: 0;
                pointer-events: none;
                transition: opacity 0.3s ease;
                z-index: 1000;
            }

            .overlay.show {
                opacity: 1;
                pointer-events: auto;
            }

            .menu-toggle {
    font-size: 22px;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    cursor: pointer;
    color: black;
    opacity: 0.75;
    padding: 0;
}

            .nav-side {
                position: fixed;
                top: 0;
                left: -100%;
                width: 100%;
                height: 100vh;
                background: #abbfd3;
                display: flex;
                flex-direction: column;
                padding: 60px 30px;
                transition: left 0.3s ease;
                z-index: 1001;
            }

            .mobile-menu {
                display: none;
            }

            .menu-links {
    margin-top: 90px;
    display: flex;
    flex-direction: column;
    gap: 18px;
}

           .menu-lang {
    margin-top: auto;
    font-size: 16px;
    opacity: 0.6;
}

            .nav-side a {
    font-size: 28px;
    font-weight: 400;
    letter-spacing: -0.5px;
}

            .nav-side a:hover {
                color: #111;
            }

            nav {
                display: none;
            }

        .menu-close {
    position: absolute;
    top: 18px;
    right: 18px;
    font-size: 34px;
    background: none;
    border: none;
    cursor: pointer;
    color: black;
    opacity: 0.6;
}
.menu-close:hover {
    opacity: 1;
}

            /* ocultamos nav original en móvil */
        }
    </style>
</head>


<body>
    <header class="header">
        <div class="site-name">
            <a href="index.html">Lucía Rodríguez</a>
        </div>
        <button class="menu-toggle" aria-label="Abrir menú">&#9776;</button>

        <nav class="nav-side">
            <button class="menu-close" aria-label="Cerrar menú">&times;</button>
            <div class="menu-links">
                <a href="about-me.html">Sobre mí</a>
                <a href="contact.html">Contacto</a>
            </div>
            <div class="menu-lang">
                <a href="english/index.html">EN</a>
            </div>
        </nav>
        <div class="overlay"></div>
        <nav>

            <a href="about-me.html">Sobre mí</a>
            <a href="contact.html">Contacto</a>
            <div class="menu-lang">
                <a id="langButtonSide" href="english/index.html">EN</a>
            </div>
        </nav>
    </header>
    <div class="page">

        <div class="filters">
            <label>
                <input type="radio" name="category" value="all" checked>
                Todos
            </label>

            <label>
                <input type="radio" name="category" value="producto">
                Producto
            </label>

            <label>
                <input type="radio" name="category" value="web">
                Web
            </label>

            <label>
                <input type="radio" name="category" value="otros">
                Otros
            </label>
        </div>

        <!-- MAIN -->
        <main class="main">

            <div class="img-center">
                <div>
                    <a href="Lo-Que-Se-Queda.html">
                        <img src="english/images/16.jpg" alt="" data-category="otros">
                    </a>
                    <p class="caption">Lo Que Se Queda</p>
                </div>

                <div>
                    <a href="cnc.html">
                        <img src="images/3.1.jpeg" alt="" class="scroll-reveal" data-category="producto">
                    </a>
                    <p class="caption">Prototipo CNC</p>
                </div>

                <div>
                    <a href="bom.html">
                        <img src="images/6.6.png" alt="" class="scroll-reveal animate-rotate" data-category="producto">
                    </a>
                    <p class="caption">Bom</p>
                </div>

                <div>
                    <a href="luxo-jr.html">
                        <img src="images/23.png" alt="" class="scroll-reveal animate-rotate" data-category="producto">
                    </a>
                    <p class="caption">Rediseño Luxo Jr</p>
                </div>


                <div>
                    <a href="calma.html">
                        <img src="images/19.jpg" alt="" class="scroll-reveal" data-category="producto">
                    </a>
                    <p class="caption">Colección Calma EASD x Royo</p>
                </div>


                <div>
                    <a href="SYNC.html">
                        <img src="images/3.2.png" alt="" class="scroll-reveal" data-category="web">
                    </a>
                    <p class="caption">SYNC</p>
                </div>

                <div>
                    <a href="laCaraB.html">
                        <img src="images/7.png" alt="" class="scroll-reveal" data-category="web">
                    </a>
                    <p class="caption">La Cara B</p>
                </div>

            </div>


        </main>

    </div>

</body>

<script>

    const menuClose = document.querySelector('.menu-close');

menuClose.addEventListener('click', () => {
    navSide.classList.remove('show');
    overlay.classList.remove('show');
});

    const scrollImages = document.querySelectorAll('.img-center img.scroll-reveal');
    const images = document.querySelectorAll('.img-center img');

    function revealOnScroll() {
        const windowHeight = window.innerHeight;
        scrollImages.forEach(img => {
            const top = img.getBoundingClientRect().top;
            if (top < windowHeight - 100) { // cuando la imagen está cerca de entrar
                img.classList.add('visible');
            }
        });
    }

    // Detectar scroll y también al cargar la página
    window.addEventListener('scroll', revealOnScroll);
    window.addEventListener('load', revealOnScroll);

    //--------------------------------------------------------------------

    const radios = document.querySelectorAll('input[name="category"]');
    const items = document.querySelectorAll('.img-center > div, .img-center > img');

    radios.forEach(radio => {
        radio.addEventListener('change', () => {
            const category = radio.value;

            items.forEach(item => {
                // Busca la imagen dentro del div si existe
                const img = item.tagName === 'IMG' ? item : item.querySelector('img');

                if (!img) return;

                // Mostrar u ocultar con fade
                if (category === 'all' || img.dataset.category === category) {
                    item.classList.remove('hidden');
                } else {
                    item.classList.add('hidden');
                }
            });
        });
    });

    const menuToggle = document.querySelector('.menu-toggle');
    const navSide = document.querySelector('.nav-side');
    const overlay = document.querySelector('.overlay');

    menuToggle.addEventListener('click', () => {
        navSide.classList.toggle('show');
        overlay.classList.toggle('show');
    });

    overlay.addEventListener('click', () => {
        navSide.classList.remove('show');
        overlay.classList.remove('show');
    });

    // Cerrar menú al click en enlace
    navSide.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', () => {
            navSide.classList.remove('show');
            overlay.classList.remove('show');
        });
    });

</script>

</html>
